name: Bug in the toolkit
description: ledgerwitness, a runner, a generator or a reproduction behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command, observed output and expected output.
    validations: { required: true }
  - type: input
    id: entry
    attributes:
      label: Corpus entry ID (if any)
      placeholder: core.testnet.cap40.signed-payload-signer.p28
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Rust/Go/Node versions, commit of this repository.
    validations: { required: true }
