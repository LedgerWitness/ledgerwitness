name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job contacts a Stellar network: everything runs against corpus/entries/.
# Dependencies are fetched from crates.io, the Go module proxy and npm.
# Third-party actions are pinned to commit SHAs; Dependabot proposes updates.
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify every corpus entry
        run: cargo run -q --locked -p ledgerwitness -- verify corpus/entries

  linter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: linter/go/go.mod
          cache-dependency-path: linter/go/go.sum
      - name: Indexer linter prototype (STLR003 seeded cases)
        run: make linter

  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.94.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: runners/go/go.mod
          cache-dependency-path: runners/go/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix runners/javascript
      - run: npm ci --prefix reproductions/js-sdk
      - name: Go runner hygiene
        run: cd runners/go && go vet ./... && test -z "$(gofmt -l .)"
      - name: Divergence matrix (current SDKs must pass)
        run: make conform
      - name: js-stellar-sdk pre/post-fix reproductions
        run: make repro-js
      - name: Recorded live testnet run, re-checked offline
        run: make testnet-evidence
      - name: Wallet replay report assertions (stored evidence only)
        run: node --test reproductions/wallet-backend/check-results.test.mjs reproductions/wallet-backend/check-results-731.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance
          path: results/conformance/
